# Editing service only. The permanent Media Worker is not managed here.
services:
  mandala-ai-editing-worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        MANDALA_PROVIDER_ID: '${MANDALA_OPENCLAW_PROVIDER_ID:-custom-ipt02mbjindt5ldise8woehy-43-129-33-7-sslip-io}'
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Jakarta
      PYTHONUNBUFFERED: '1'
      MALLOC_ARENA_MAX: '2'
      MANDALA_EDITING_PORT: '3003'
      MANDALA_OPENCLAW_PROVIDER_ID: '${MANDALA_OPENCLAW_PROVIDER_ID:-custom-ipt02mbjindt5ldise8woehy-43-129-33-7-sslip-io}'
      MANDALA_EDITING_DATABASE_URL: '${MANDALA_EDITING_DATABASE_URL:-}'
      MANDALA_SOURCE_DATABASE_URL: '${MANDALA_SOURCE_DATABASE_URL:-}'
      MANDALA_EDITING_API_TOKEN: '${MANDALA_EDITING_API_TOKEN:-}'
      MANDALA_EDITING_OPERATOR_TOKEN: '${MANDALA_EDITING_OPERATOR_TOKEN:-}'
      MANDALA_EDITING_PROOF: '${MANDALA_EDITING_PROOF:-}'
      MANDALA_EDITING_LIVE_ROLES_ENABLED: '${MANDALA_EDITING_LIVE_ROLES_ENABLED:-0}'
      # Reuse intake's Stage 3 logical path; this service never downloads media.
      AUTOCLIPPER_SOURCE_ROOT: /data/source
    volumes:
      - type: volume
        source: originals
        target: /data
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: originals
        target: /app/original-store
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: editing_data
        target: /app/data
        volume:
          nocopy: true
    expose:
      - '3003'
    networks:
      - default
      - database
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3003/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 3584m
    cpus: 1.5

networks:
  database:
    external: true
    name: '${MANDALA_DATABASE_NETWORK:-coolify}'

volumes:
  originals:
    external: true
    name: '${MANDALA_ORIGINAL_VOLUME:?Set the exact pre-existing originals volume name}'
  editing_data:
    name: '${MANDALA_EDITING_OUTPUT_VOLUME:-mandala-ai-editing-output}'
